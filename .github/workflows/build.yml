name: Build ESP32-S3 IMG
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.2
    steps:
      - uses: actions/checkout@v4
      - run: python rg_tool.py --target esp32s3-devkitc build-img
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-img
          path: "*.img"
