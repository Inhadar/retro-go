name: Build ESP32-S3 IMG

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Git Ownership
        run: git config --global --add safe.directory /__w/retro-go/retro-go

      - name: Build IMG
        run: python rg_tool.py --target esp32-s3-devkit build-img

      - name: Upload IMG
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-img
          path: "*.img"
